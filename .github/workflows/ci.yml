name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint Python
        run: ruff check src tests jobs
      - name: Lint CloudFormation
        run: cfn-lint infra/cloudformation.yaml
      - name: Unit and integration tests
        run: pytest
      - name: End-to-end pipeline run (20k packages)
        run: python -m delivery_pipeline.run_pipeline --packages 20000 --fresh
      - uses: actions/upload-artifact@v4
        with:
          name: kpi-reports
          path: reports/
