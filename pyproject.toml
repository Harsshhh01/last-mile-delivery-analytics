[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "delivery-pipeline"
version = "1.0.0"
description = "Last-mile delivery analytics: AWS data lake, Redshift star schema and a GenAI analytics agent"
readme = "README.md"
authors = [{ name = "Harsh Jangid" }]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "pyspark>=3.5",
    "pandas>=2.0",
    "pyarrow>=14",
    "duckdb>=1.0",
    "sqlglot>=25",
    "boto3>=1.34",
]

[project.optional-dependencies]
dev = ["pytest>=8", "moto[s3,glue,firehose]>=5", "ruff>=0.5", "cfn-lint>=1.0"]
anthropic = ["anthropic>=0.40"]

[project.scripts]
delivery-pipeline = "delivery_pipeline.run_pipeline:main"
delivery-agent = "delivery_pipeline.agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B905"]  # zip(strict=) is optional style here
